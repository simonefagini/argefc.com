<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#195c33">

  <title>404 — ARGE FC</title>

  <!-- Immediate background while the external CSS loads -->
  <style>
    html,
    body {
      background-color: #195c33;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap"
  >

  <!-- Preload logo -->
  <link
    rel="preload"
    as="image"
    href="/resources/logo.png"
  >

  <!-- 404 page stylesheet -->
  <link rel="stylesheet" href="/404.css">

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/resources/favicon-32.png"
  >
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/resources/apple-touch-icon.png"
  >
</head>

<body>

  <main class="error-page">

    <div class="error-enter">

      <a
        class="error-link"
        id="error-link"
        href="/home.html"
        aria-label="Return to ARGE FC home page"
      >

        <span class="error-number error-number-left">
          4
        </span>

        <span class="error-bee">
          <img
            src="/resources/logo.png"
            alt=""
            width="4146"
            height="4147"
            fetchpriority="high"
          >
        </span>

        <span class="error-number error-number-right">
          4
        </span>

      </a>

    </div>

  </main>

  <!-- 404 page script -->
  <script src="/404.js"></script>

</body>
</html>
